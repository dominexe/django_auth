<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в управление заявками</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"
    >
</head>

<body>
<div class="page page-center">
    <main class="container container-tight py-4">
        <div class="card">
            <div class="card-body">
                <h1 class="h2 text-center mb-4">Вход в управление заявками</h1>

                <p class="text-secondary">
                    Используйте существующую учётную запись сайта.
                </p>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Не удалось войти. Проверьте логин и пароль.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label class="form-label" for="id_username">
                            {{ form.username.label }}
                        </label>

                        <input
                            class="form-control"
                            id="id_username"
                            name="username"
                            type="text"
                            value="{{ form.username.value|default_if_none:'' }}"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="id_password">
                            Пароль
                        </label>

                        <input
                            class="form-control"
                            id="id_password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button class="btn btn-primary w-100" type="submit">
                        Войти
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/">Вернуться на сайт</a>
        </div>
    </main>
</div>
</body>
</html>
